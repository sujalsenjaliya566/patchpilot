[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Autonomous closed-loop bug reproduction and self-healing agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ui = [
    "flask>=3.0",
    "flask-cors>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.scripts]
patchpilot = "patchpilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patchpilot"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/patchpilot"]
omit = ["*/cli.py"]

[tool.coverage.report]
fail_under = 80
